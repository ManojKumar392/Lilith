<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Lilith | Dashboard</title>

    <link
            rel="stylesheet"
            href="/css/dashboard.css"
    >

    <script
            src="https://cdn.jsdelivr.net/npm/chart.js">
    </script>
</head>

<body>

<header>

    <div>
        <h1>Lilith</h1>
        <p>Safety Insights</p>
    </div>

    <nav>
        <a href="/">Map</a>
        <a href="/dashboard.html">Insights</a>
        <a href="/about.html">About</a>
        <button id="logout-button">Logout</button>
    </nav>

</header>


<main>

    <section class="stats">

        <div class="stat-card">
            <span>Total Reports</span>
            <strong id="total-reports">0</strong>
        </div>

        <div class="stat-card">
            <span>Affected Areas</span>
            <strong id="affected-areas">0</strong>
        </div>

    </section>


    <section class="charts">

        <div class="chart-card">

            <h2>Reports by Severity</h2>

            <div class="chart-container">
                <canvas id="severity-chart"></canvas>
            </div>

        </div>


        <div class="chart-card">

            <h2>Reports by Reason</h2>

            <div class="chart-container">
                <canvas id="reason-chart"></canvas>
            </div>

        </div>

    </section>

    <section class="recent-section">

        <div class="recent-card">

            <h2>Recent Reports</h2>

            <div id="recent-reports"></div>

        </div>

    </section>

</main>

<script src="/js/dashboard.js"></script>

</body>
</html>
