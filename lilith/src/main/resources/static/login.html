<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lilith | Login</title>

    <link rel="stylesheet" href="/css/login.css">
</head>

<body>

<div class="auth-container">

    <div class="brand">
        <h1>Lilith</h1>
        <p>Community Safety Mapping</p>
    </div>

    <div class="auth-card">

        <div class="tabs">
            <button id="login-tab" class="active">
                Login
            </button>

            <button id="register-tab">
                Register
            </button>
        </div>

        <!-- LOGIN -->

        <form id="login-form">

            <h2>Welcome Back</h2>

            <label>Email</label>
            <input
                    type="email"
                    id="login-email"
                    required
            >

            <label>Password</label>
            <input
                    type="password"
                    id="login-password"
                    required
            >

            <button type="submit">
                Login
            </button>

        </form>


        <!-- REGISTER -->

        <form id="register-form" class="hidden">

            <h2>Create Account</h2>

            <label>Name</label>
            <input
                    type="text"
                    id="register-name"
                    required
            >

            <label>Email</label>
            <input
                    type="email"
                    id="register-email"
                    required
            >

            <label>Password</label>
            <input
                    type="password"
                    id="register-password"
                    minlength="6"
                    required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <p id="auth-message"></p>

    </div>

</div>

<script src="/js/login.js"></script>

</body>
</html>
